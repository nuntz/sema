name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch to test and deploy (a rollback); empty for master
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      DYNAMODB_ENDPOINT: http://localhost:8000
      GOCACHE: /tmp/sema-go-build
      GOMODCACHE: /tmp/sema-go-mod
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      # A dispatch `ref` may name a branch; deploy the commit tested here, even if the branch moves.
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # The same checks as a local `make check`: lint, format, vet, unit tests, the web build, and
      # reproducible Lambda ZIPs.
      - run: make check

  # The browser tests run beside the test job and gate the deploy as well (make e2e).
  e2e:
    # Playwright 1.60 can't install Chromium on ubuntu-latest (26.04); unpin once it supports 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: web
      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium
        working-directory: web
      - run: make e2e
      # Playwright's per-test output (error context, captured images) for reading a CI-only failure.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: /tmp/sema-playwright-results
          retention-days: 7

  # The deploy role trusts only this repository's `production` environment, which GitHub limits to
  # master (RUNBOOK.md → CI deploys, docs/adr/0004-ci-deploys-through-github-oidc.md). Until the
  # wizard sets PULUMI_STACK, and on forks, it is skipped.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && vars.PULUMI_STACK != ''
    needs: [test, e2e]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy
      cancel-in-progress: false
    # id-token: write lets the job ask GitHub for OIDC tokens, which it exchanges for AWS and
    # Pulumi Cloud credentials, so it reads no stored credential.
    permissions:
      contents: read
      id-token: write
    env:
      GOCACHE: /tmp/sema-go-build
      GOMODCACHE: /tmp/sema-go-mod
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.test.outputs.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            infra/go.sum
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # `pulumi up` runs `make build` itself; building first fails fast, before AWS credentials,
      # and guards the SPA against an empty client ID. The second build finds the ZIPs up to date.
      - name: Build the arm64 Lambda ZIPs
        run: make lambdas

      - uses: pulumi/actions@v7
        with:
          pulumi-version: 3.272.0

      # Pulumi Cloud trusts this job's OIDC claims (this repository by ID, the `production`
      # environment, master, this workflow, a push or dispatch) and exchanges them for a one-hour
      # personal token of PULUMI_CI_USER, exported masked as PULUMI_ACCESS_TOKEN (RUNBOOK.md →
      # Pulumi Cloud sign-in).
      - name: Find the Pulumi organization
        id: pulumi-identity
        env:
          PULUMI_STACK: ${{ vars.PULUMI_STACK }}
          PULUMI_CI_USER: ${{ vars.PULUMI_CI_USER }}
        run: |
          : "${PULUMI_CI_USER:?Set the PULUMI_CI_USER repository variable (RUNBOOK.md → Pulumi Cloud sign-in)}"
          echo "organization=${PULUMI_STACK%%/*}" >> "$GITHUB_OUTPUT"

      # v2.1.1; review the bundled dist/index.js before moving the pin.
      - uses: pulumi/auth-actions@159c3e431aab767d4519b96f3f784d7d3d725622
        with:
          organization: ${{ steps.pulumi-identity.outputs.organization }}
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:${{ vars.PULUMI_CI_USER }}
          token-expiration: 3600

      # Fails fast, before AWS credentials, if the trust policy issued a token for anyone else.
      - name: Check the Pulumi identity
        env:
          PULUMI_CI_USER: ${{ vars.PULUMI_CI_USER }}
        run: |
          user="$(pulumi whoami)"
          echo "Signed in to Pulumi Cloud as $user"
          [[ "$user" == "$PULUMI_CI_USER" ]] || { echo "::error::Expected $PULUMI_CI_USER" >&2; exit 1; }

      # infra/Pulumi.prod.yaml already imports the environment; `config env add` would import it a
      # second time, so it only runs for a stack file that lacks it.
      - name: Select the stack and its ESC environment
        id: stack
        working-directory: infra
        env:
          PULUMI_STACK: ${{ vars.PULUMI_STACK }}
          PULUMI_ESC_ENVIRONMENT: ${{ vars.PULUMI_ESC_ENVIRONMENT }}
        run: |
          pulumi stack select "$PULUMI_STACK"
          if ! pulumi config env ls --output json | jq -e --arg env "$PULUMI_ESC_ENVIRONMENT" 'index($env)' > /dev/null; then
            pulumi config env add "$PULUMI_ESC_ENVIRONMENT" --yes > /dev/null
          fi
          # Assigned first, so a failing `config get` fails this step instead of passing an empty value.
          region="$(pulumi config get aws:region)"
          google_client_id="$(pulumi config get sema:googleClientId)"
          echo "region=$region" >> "$GITHUB_OUTPUT"
          echo "google-client-id=$google_client_id" >> "$GITHUB_OUTPUT"

      # Vite inlines the client ID at build time; without it, Google sign-in fails in the browser.
      - name: Build the web app
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ steps.stack.outputs.google-client-id }}
        run: |
          : "${VITE_GOOGLE_CLIENT_ID:?sema:googleClientId is missing from the stack config}"
          make web

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: sema-deploy-${{ github.run_id }}
          aws-region: ${{ steps.stack.outputs.region }}

      - name: pulumi up
        working-directory: infra
        run: pulumi up --yes

      - name: Invalidate CloudFront
        working-directory: infra
        run: |
          aws cloudfront create-invalidation --distribution-id "$(pulumi stack output distributionId)" --paths '/*' > /dev/null

      - name: Check the live site
        run: bash scripts/check-live.sh
