name: sema
runtime: go
description: Sema feed triage infrastructure
config:
  sema:googleClientId:
    secret: true
  sema:modelVersion:
    default: amazon.titan-embed-text-v2:0
  sema:scoringVersion:
    default: "2"
  sema:vectorIndex:
    default: items
  sema:vectorDimensions:
    type: integer
    default: 1024
  sema:alarmTopicName:
    default: NotifyMe
  sema:domain:
    type: string
    description: Optional custom hostname for the CloudFront distribution
  sema:route53ZoneId:
    type: string
    description: Optional Route 53 hosted-zone ID for automatic certificate and alias records
